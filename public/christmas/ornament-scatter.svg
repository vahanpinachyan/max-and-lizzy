<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!--
    The season's background pattern: two of the site's own ornaments (see
    components/christmas/ornaments.tsx) as flat silhouettes, on a tile that
    repeats behind the whole page.

    Silhouettes rather than faded copies of the full drawings. At the tint
    strength this has to sit at — barely separated from the cream it lies on —
    a multi-coloured ornament turns to mud, while one clean shape still reads
    as holly or as a little tree.

    Two shapes, down from eight. Each cut made the page quieter and better:
    behind seven hundred product photographs this wants to be something you
    notice on the second look, not a pattern competing with the toys. They
    are placed off the diagonal, because two motifs on an exact diagonal
    line themselves up into stripes once the tile repeats, and clear of
    every edge, so the tile joins itself without a cut shape anywhere.

    Colours are the palette's own, mixed down into the cream (#f7f2e6) and
    written out as flat hex so they cannot drift if a token changes: pine and
    holly, both at 22%.

    That percentage is a contrast ceiling, not a taste call. A letter that
    lands squarely on a shape still has to be readable, so the tint is set by
    the lightest text colour the site puts on this background (wood-dark
    #6e4529): it measures 5.07:1 on the pine shape, clear of the 4.5:1 the
    guidelines ask for, and body text in espresso stays above 8:1. Darkening
    beyond roughly 30% starts to fail that test.
  -->
  <g fill="#c7cdbf">
    <!-- Holly sprig, upper left -->
    <g transform="translate(58,52) rotate(-14) scale(1.7)">
      <path d="M12 13c-2.6-.4-4.6-2-5.2-4.3C8.9 7.4 11.3 8 12.6 9.8 13.1 7.3 12.3 5 10.6 3.4c2.9-.4 5.3 1 6.2 3.5.9-1 2.2-1.6 3.6-1.6-.4 2.6-2.2 4.6-4.6 5.4 1.8.5 3 1.7 3.5 3.4-2.4.4-4.4-.3-5.7-1.9z"/>
      <circle cx="10.4" cy="16.6" r="1.9"/>
      <circle cx="14" cy="18.4" r="1.6"/>
      <circle cx="7.6" cy="19" r="1.4"/>
    </g>
    <!-- Little tree, lower right -->
    <g transform="translate(262,236) rotate(-4) scale(1.05)">
      <path d="M24 3 36 22H12z"/>
      <path d="M24 14 39 36H9z"/>
      <path d="M24 26 42 51H6z"/>
      <path d="M19 51h10v6H19z"/>
      <path d="M15 56h18l-2 7H17z"/>
    </g>
  </g>
</svg>
