<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!--
    The season's background pattern: the site's own ornaments (see
    components/christmas/ornaments.tsx) drawn as thin outlines, on a tile that
    repeats behind the whole page.

    Outlines, not filled silhouettes. A solid shape this pale has no detail
    left in it: the bow loses its knot and its tails and becomes a blob, and
    the holly becomes a smudge. The same shapes drawn as a line keep every
    edge that says what they are, and a line this fine carries far less weight
    on the page than a filled area of the same colour, so the pattern is both
    clearer and quieter than the version it replaces.

    Mixed, and that is the point. A tile repeats on a grid whatever is in it,
    so a tile holding one of a shape prints that shape at the same spacing for
    ever and the eye finds the rows immediately. Five different shapes at five
    unrelated positions give it nothing to line up on: no two sit at a similar
    height, no two at a similar distance from the left, and the second holly
    is turned most of the way round so it does not answer the first. Nothing
    touches an edge, so the tile joins itself without a cut shape anywhere.

    One colour throughout — the palette's pine, mixed down into the cream
    (#f7f2e6) to 22% and written out flat so it cannot drift if a token
    changes. 22% is a contrast ceiling rather than a taste call: a letter that
    lands on a line still has to be readable, and this is where the lightest
    text the site puts on this background (wood-dark #6e4529) holds 5.07:1 and
    the Christmas Collection's red script holds 4.50:1, both at or above the
    4.5:1 the guidelines ask for. Body text in espresso stays above 8:1.
    Darker reads better in isolation and fails that test.
  -->
  <g fill="none" stroke="#c7cdbf" stroke-width="1.3"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Holly sprig, upper left: two leaves and three berries -->
    <g transform="translate(56,72) rotate(-16) scale(1.55)">
      <path d="M12 13c-2.6-.4-4.6-2-5.2-4.3C8.9 7.4 11.3 8 12.6 9.8 13.1 7.3 12.3 5 10.6 3.4c2.9-.4 5.3 1 6.2 3.5.9-1 2.2-1.6 3.6-1.6-.4 2.6-2.2 4.6-4.6 5.4 1.8.5 3 1.7 3.5 3.4-2.4.4-4.4-.3-5.7-1.9z"/>
      <circle cx="10.4" cy="16.6" r="1.9"/>
      <circle cx="14" cy="18.4" r="1.6"/>
      <circle cx="7.6" cy="19" r="1.4"/>
    </g>

    <!-- Fir tree, left of centre and low -->
    <g transform="translate(130,236) rotate(-5) scale(0.9)">
      <path d="M24 3 36 22H12z"/>
      <path d="M24 14 39 36H9z"/>
      <path d="M24 26 42 51H6z"/>
      <path d="M19 51h10v6H19z"/>
      <path d="M15 56h18l-2 7H17z"/>
    </g>

    <!-- Holly again, bottom right, turned right round so it reads as its own
         shape rather than as the first one repeated -->
    <g transform="translate(284,322) rotate(132) scale(1.15)">
      <path d="M12 13c-2.6-.4-4.6-2-5.2-4.3C8.9 7.4 11.3 8 12.6 9.8 13.1 7.3 12.3 5 10.6 3.4c2.9-.4 5.3 1 6.2 3.5.9-1 2.2-1.6 3.6-1.6-.4 2.6-2.2 4.6-4.6 5.4 1.8.5 3 1.7 3.5 3.4-2.4.4-4.4-.3-5.7-1.9z"/>
      <circle cx="10.4" cy="16.6" r="1.9"/>
      <circle cx="14" cy="18.4" r="1.6"/>
      <circle cx="7.6" cy="19" r="1.4"/>
    </g>

    <!-- Bow, top right. Drawn as loops, knot and tails rather than as one
         outline, so it still reads as a tied ribbon at this size. -->
    <g transform="translate(246,34) rotate(10)">
      <path d="M20 12C16.4 6.6 11.8 4 6.6 4.8 2.8 5.4 1.2 9 3.4 11.9c2 2.6 7.1 3.4 16.6 1.6z"/>
      <path d="M20 12c3.6-5.4 8.2-8 13.4-7.2 3.8.6 5.4 4.2 3.2 7.1-2 2.6-7.1 3.4-16.6 1.6z"/>
      <path d="M18.4 14.6 11 26.2l7.6-5.1"/>
      <path d="M21.6 14.6 29 26.2l-7.6-5.1"/>
      <ellipse cx="20" cy="13" rx="3.2" ry="2.7"/>
    </g>

    <!-- Snowflake, right -->
    <g transform="translate(348,196) scale(0.95)">
      <path d="M12 2v20M3.3 7l17.4 10M20.7 7 3.3 17"/>
      <path d="M12 6.4 9.4 4.2M12 6.4l2.6-2.2M12 17.6l-2.6 2.2M12 17.6l2.6 2.2"/>
    </g>
  </g>
</svg>
