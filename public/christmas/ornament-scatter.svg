<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!--
    The season's background pattern: the site's own ornaments (see
    components/christmas/ornaments.tsx) as flat silhouettes, on a tile that
    repeats behind the whole page.

    Silhouettes rather than faded copies of the full drawings. At the tint
    strength this has to sit at — barely separated from the cream it lies on —
    a multi-coloured ornament turns to mud, while one clean shape still reads
    as holly, or a bow, or a little tree.

    Mixed, and that is the point. A tile repeats on a grid whatever is in it,
    so a tile holding one of a shape prints that shape at the same spacing
    for ever and the eye finds the rows immediately — a page of trees in
    columns, which is exactly what one earlier version gave. Five different
    shapes at five unrelated positions give the eye nothing to line up: no
    two sit at a similar height, no two at a similar distance from the left,
    and the second holly is turned most of the way round so it does not
    answer the first. Nothing touches an edge, so the tile joins itself
    without a cut shape anywhere.

    Colours are the palette's own, mixed down into the cream (#f7f2e6) and
    written out as flat hex so they cannot drift if a token changes: pine at
    22%, holly at 22%, and a warm grey at 26% for the snowflake.

    Those percentages are a contrast ceiling, not a taste call. A letter that
    lands squarely on the darkest shape here still has to be readable, so the
    tints are set by the lightest text colour the site puts on this
    background (wood-dark #6e4529): it measures 5.07:1 on the pine shape and
    5.13:1 on the bow, both clear of the 4.5:1 the guidelines ask for, and
    body text in espresso stays above 8:1 throughout. Darkening these beyond
    roughly 30% starts to fail that test.
  -->
  <g fill="#c7cdbf">
    <!-- Holly sprig, upper left -->
    <g transform="translate(56,72) rotate(-16) scale(1.55)">
      <path d="M12 13c-2.6-.4-4.6-2-5.2-4.3C8.9 7.4 11.3 8 12.6 9.8 13.1 7.3 12.3 5 10.6 3.4c2.9-.4 5.3 1 6.2 3.5.9-1 2.2-1.6 3.6-1.6-.4 2.6-2.2 4.6-4.6 5.4 1.8.5 3 1.7 3.5 3.4-2.4.4-4.4-.3-5.7-1.9z"/>
      <circle cx="10.4" cy="16.6" r="1.9"/>
      <circle cx="14" cy="18.4" r="1.6"/>
      <circle cx="7.6" cy="19" r="1.4"/>
    </g>
    <!-- Little tree, left of centre and low -->
    <g transform="translate(130,236) rotate(-5) scale(0.9)">
      <path d="M24 3 36 22H12z"/>
      <path d="M24 14 39 36H9z"/>
      <path d="M24 26 42 51H6z"/>
      <path d="M19 51h10v6H19z"/>
      <path d="M15 56h18l-2 7H17z"/>
    </g>
    <!-- Holly again, bottom right, turned right round so it reads as its own
         shape rather than as the first one repeated -->
    <g transform="translate(284,322) rotate(132) scale(1.15)">
      <path d="M12 13c-2.6-.4-4.6-2-5.2-4.3C8.9 7.4 11.3 8 12.6 9.8 13.1 7.3 12.3 5 10.6 3.4c2.9-.4 5.3 1 6.2 3.5.9-1 2.2-1.6 3.6-1.6-.4 2.6-2.2 4.6-4.6 5.4 1.8.5 3 1.7 3.5 3.4-2.4.4-4.4-.3-5.7-1.9z"/>
      <circle cx="10.4" cy="16.6" r="1.9"/>
      <circle cx="14" cy="18.4" r="1.6"/>
      <circle cx="7.6" cy="19" r="1.4"/>
    </g>
  </g>

  <!-- Bow, top right -->
  <g fill="#e5c5bd" transform="translate(246,34) rotate(10)">
    <path d="M20 12C16.4 6.6 11.8 4 6.6 4.8 2.8 5.4 1.2 9 3.4 11.9c2 2.6 7.1 3.4 16.6 1.6z"/>
    <path d="M20 12c3.6-5.4 8.2-8 13.4-7.2 3.8.6 5.4 4.2 3.2 7.1-2 2.6-7.1 3.4-16.6 1.6z"/>
    <path d="M18.4 14.6 11 26.2l7.6-5.1z"/>
    <path d="M21.6 14.6 29 26.2l-7.6-5.1z"/>
    <ellipse cx="20" cy="13" rx="3.4" ry="2.9"/>
  </g>

  <!-- Snowflake, right. Drawn rather than filled, so it stays airy. -->
  <g fill="none" stroke="#d3cfc3" stroke-width="1.5" stroke-linecap="round"
     transform="translate(348,196) scale(0.95)">
    <path d="M12 2v20M3.3 7l17.4 10M20.7 7 3.3 17"/>
    <path d="M12 6.4 9.4 4.2M12 6.4l2.6-2.2M12 17.6l-2.6 2.2M12 17.6l2.6 2.2"/>
  </g>
</svg>
